<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>口袋灌篮 · 底部 Tab UI 原型</title>
<style>
  @font-face {
    font-family: "FusionPixel";
    src: url("../assets/fonts/fusion-pixel-12-sc.subset.woff2") format("woff2");
    font-weight: 400 800;
    font-display: swap;
  }

  :root {
    --bg: #060606;
    --panel: #111111;
    --panel-2: #171717;
    --panel-3: #1d1d1d;
    --line: #303030;
    --line-soft: #242424;
    --ink: #f4f1e8;
    --ink-dim: #b8b8b8;
    --muted: #8f8f8f;
    --green: #b8e63c;
    --green-2: #8fbf2a;
    --orange: #ff7a1a;
    --orange-2: #ff9a4d;
    --red: #ff8a7f;
    --blue: #7bd3ff;
    --font: "FusionPixel", "PingFang SC", "Microsoft YaHei", monospace;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background:
      radial-gradient(circle at 50% 20%, rgba(184,230,60,.08), transparent 32%),
      radial-gradient(circle at 80% 80%, rgba(255,122,26,.06), transparent 28%),
      #030303;
    color: var(--ink); font-family: var(--font);
  }
  button, input { font: inherit; }
  button { color: inherit; cursor: pointer; }
  svg { display: block; }
  img { image-rendering: pixelated; }

  #stage {
    position: relative; flex: 0 0 390px; width: 390px; height: 844px;
    overflow: hidden; background: var(--bg);
    box-shadow: 0 0 0 1px #1c1c1c, 0 28px 80px rgba(0,0,0,.8);
    transform-origin: center center;
  }

  .app { position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .app::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .28;
    background:
      linear-gradient(90deg, transparent 0 48.5%, rgba(255,255,255,.035) 48.5% 49%, transparent 49% 100%),
      linear-gradient(0deg, transparent 0 48.5%, rgba(255,255,255,.025) 48.5% 49%, transparent 49% 100%);
    background-size: 100% 100%;
    mask-image: linear-gradient(to bottom, #000, transparent 68%);
  }

  /* ============ 顶栏 ============ */
  .topbar {
    position: relative; z-index: 3; display: flex; align-items: center; gap: 7px;
    padding: 12px 12px 8px; flex: 0 0 auto;
  }
  .coach {
    min-width: 0; flex: 1; display: flex; align-items: center; gap: 8px;
    padding: 4px 7px 4px 4px; border: 1px solid var(--line-soft); border-radius: 6px;
    background: rgba(17,17,17,.86); text-align: left;
  }
  .coach:active, .icon-btn:active, .coin-chip:active { transform: translateY(1px); }
  .avatar {
    width: 31px; height: 31px; flex: 0 0 auto; display: grid; place-items: center;
    border: 1px solid #4b4b4b; border-radius: 5px;
    background: linear-gradient(145deg, #2a2a2a, #101010); color: var(--green);
  }
  .avatar svg { width: 18px; height: 18px; }
  .coach-copy { min-width: 0; }
  .coach-copy b { display: block; font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .coach-copy small { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .coin-chip {
    display: flex; align-items: center; gap: 5px; height: 31px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 6px; background: #101010;
    color: var(--green); font-size: 11px;
  }
  .coin-chip svg { width: 15px; height: 15px; }
  .icon-btn {
    position: relative; width: 31px; height: 31px; padding: 0; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 6px; background: #101010; color: var(--ink-dim);
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .dot {
    position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--orange); border: 1px solid #060606;
  }

  /* ============ 内容区 ============ */
  .content {
    position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto;
    padding: 2px 12px 86px; scrollbar-width: none; overscroll-behavior: contain;
  }
  .content::-webkit-scrollbar { display: none; }
  .page { animation: pageIn .2s ease both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 6px 1px 12px; }
  .eyebrow { display: block; margin-bottom: 3px; color: var(--green); font-size: 8px; letter-spacing: 1.8px; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 1.1; letter-spacing: 1px; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
  .head-side { flex: 0 0 auto; text-align: right; }
  .season-pill, .power-pill, .record-pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
    color: var(--ink-dim); font-size: 9px; white-space: nowrap;
  }
  .power-pill b { color: var(--green); font-size: 12px; }

  .card {
    position: relative; border: 1px solid var(--line-soft); border-radius: 7px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    box-shadow: 0 1px 0 rgba(255,255,255,.035);
  }
  .card:active { transform: translateY(1px); }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 1px 8px; }
  .section-head h3 { margin: 0; font-size: 13px; letter-spacing: .5px; }
  .section-head button { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 9px; padding: 2px; }
  .section-head button svg { width: 11px; height: 11px; }
  .section-head button:active { color: var(--green); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    min-height: 30px; padding: 0 10px; border: 1px solid var(--green); border-radius: 4px;
    background: var(--green); color: #080808; font-size: 10px; font-weight: 800;
  }
  .btn:active { transform: translateY(1px); background: var(--green-2); }
  .btn.ghost { background: transparent; color: var(--green); }
  .btn.small { min-height: 26px; padding: 0 8px; font-size: 9px; }
  .btn.full { width: 100%; min-height: 36px; }
  .btn.orange { border-color: var(--orange); background: var(--orange); }
  .btn svg { width: 13px; height: 13px; }

  /* ============ 主场 ============ */
  .hero-card {
    position: relative; width: 100%; overflow: hidden; text-align: left; padding: 0;
    border: 1px solid #3b3b3b; border-radius: 8px;
    background: linear-gradient(145deg, #262626 0%, #101010 55%, #0b0b0b 100%);
    box-shadow: 0 12px 26px rgba(0,0,0,.35);
  }
  .hero-court { position: absolute; inset: 0; opacity: .55; pointer-events: none; }
  .hero-court::before {
    content: ""; position: absolute; width: 220px; height: 220px; right: -76px; top: -38px;
    border: 1px solid rgba(184,230,60,.28); border-radius: 50%;
  }
  .hero-court::after {
    content: ""; position: absolute; width: 96px; height: 96px; right: -18px; top: 42px;
    border: 1px solid rgba(184,230,60,.2); border-radius: 50%;
    background: linear-gradient(90deg, transparent 49%, rgba(184,230,60,.18) 49% 51%, transparent 51%);
  }
  .hero-inner { position: relative; z-index: 1; padding: 12px; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font-size: 9px; letter-spacing: 1px; }
  .tag::before { content: ""; width: 5px; height: 5px; background: var(--green); border-radius: 50%; }
  .hero-badge { padding: 3px 6px; border: 1px solid #404040; border-radius: 3px; color: var(--ink-dim); font-size: 8px; }
  .hero-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 17px 0 13px; }
  .hero-main small { color: var(--muted); font-size: 10px; }
  .hero-main h2 { margin: 3px 0 4px; font-size: 25px; letter-spacing: 1px; }
  .hero-main p { margin: 0; color: var(--ink-dim); font-size: 9px; }
  .hero-ball { width: 62px; height: 62px; flex: 0 0 auto; display: grid; place-items: center; color: var(--orange); opacity: .95; }
  .hero-ball svg { width: 58px; height: 58px; }
  .hero-cta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-top: 1px solid #303030; background: rgba(184,230,60,.08);
    color: var(--green); font-size: 11px; font-weight: 800;
  }
  .hero-cta svg { width: 15px; height: 15px; }

  .daily-card {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px;
    text-align: left;
  }
  .daily-icon {
    width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center;
    border: 1px solid #3d3d3d; border-radius: 5px; background: #202020; color: var(--orange);
  }
  .daily-icon svg { width: 18px; height: 18px; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 6px; }
  .row.between { justify-content: space-between; }
  .daily-card b { font-size: 10px; }
  .daily-card p { margin: 3px 0 5px; color: var(--muted); font-size: 8px; }
  .pill { padding: 2px 5px; border: 1px solid #3b3b3b; border-radius: 3px; color: var(--ink-dim); font-size: 8px; white-space: nowrap; }
  .bar { height: 4px; overflow: hidden; border-radius: 2px; background: #2a2a2a; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
  .stat { padding: 8px 9px; }
  .stat small { display: block; color: var(--muted); font-size: 8px; }
  .stat b { display: block; margin-top: 4px; font-size: 15px; }
  .stat em { font-style: normal; color: var(--green); font-size: 9px; }

  .lineup-strip { display: flex; gap: 6px; }
  .mon-chip {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 7px 3px 6px; border: 1px solid var(--line-soft); border-radius: 6px;
    background: var(--panel);
  }
  .mon-chip img { width: 38px; height: 38px; object-fit: contain; }
  .mon-chip b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8px; }
  .mon-chip small { color: var(--green); font-size: 7px; }

  .news-list { overflow: hidden; }
  .news-item { display: flex; gap: 8px; width: 100%; padding: 9px 10px; text-align: left; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; }
  .news-item:last-child { border-bottom: 0; }
  .news-dot { width: 6px; height: 6px; margin-top: 4px; flex: 0 0 auto; border-radius: 50%; background: var(--green); }
  .news-item b { display: block; font-size: 9px; }
  .news-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }

  /* ============ 球队 ============ */
  .team-hero { overflow: hidden; }
  .court-lineup {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 4px;
    padding: 13px 9px 8px; background:
      radial-gradient(ellipse at 50% 100%, rgba(184,230,60,.13), transparent 54%),
      repeating-linear-gradient(90deg, transparent 0 48px, rgba(255,255,255,.025) 48px 49px);
    border-bottom: 1px solid var(--line-soft);
  }
  .slot { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .slot img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 4px 4px rgba(0,0,0,.45)); }
  .slot b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8px; }
  .slot small { color: var(--green); font-size: 7px; }
  .team-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
  .team-meta b { font-size: 10px; }
  .team-meta span { color: var(--muted); font-size: 8px; }

  .action-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
  .action-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 4px; font-size: 9px; }
  .action-btn svg { width: 14px; height: 14px; color: var(--green); }

  .player-list { overflow: hidden; }
  .player-row {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 9px;
    border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; text-align: left;
  }
  .player-row:last-child { border-bottom: 0; }
  .player-row:active { background: #1a1a1a; }
  .player-row img { width: 34px; height: 34px; object-fit: contain; }
  .pos {
    flex: 0 0 auto; width: 25px; padding: 3px 0; text-align: center;
    border: 1px solid #3b3b3b; border-radius: 3px; color: var(--ink-dim); font-size: 7px;
  }
  .player-name { flex: 1; min-width: 0; }
  .player-name b { display: block; font-size: 9px; }
  .player-name small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
  .player-ovr { text-align: right; }
  .player-ovr b { display: block; color: var(--green); font-size: 14px; }
  .player-ovr small { color: var(--muted); font-size: 7px; }
  .player-row > svg { width: 13px; height: 13px; color: #5a5a5a; }

  .bench-row { display: flex; gap: 6px; padding: 8px; }
  .bench-mon { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 5px; background: #171717; border: 1px solid #292929; border-radius: 4px; }
  .bench-mon img { width: 24px; height: 24px; object-fit: contain; }
  .bench-mon span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 7px; color: var(--ink-dim); }

  /* ============ 赛程 ============ */
  .season-card { padding: 11px; }
  .season-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .season-top b { font-size: 11px; }
  .season-top span { color: var(--muted); font-size: 8px; }
  .badge-row { display: flex; gap: 5px; margin-bottom: 11px; }
  .badge-dot {
    flex: 1; height: 18px; display: grid; place-items: center;
    border: 1px solid #383838; border-radius: 3px; background: #161616;
    color: #555; font-size: 7px;
  }
  .badge-dot.on { border-color: rgba(184,230,60,.5); background: rgba(184,230,60,.1); color: var(--green); }
  .badge-dot.cur { border-color: var(--orange); color: var(--orange); box-shadow: 0 0 0 1px rgba(255,122,26,.18); }

  .route-map { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .node {
    position: relative; display: flex; align-items: center; gap: 6px; min-width: 0;
    padding: 7px; border: 1px solid #2b2b2b; border-radius: 5px; background: #141414;
  }
  .node-dot {
    width: 21px; height: 21px; flex: 0 0 auto; display: grid; place-items: center;
    border: 1px solid #454545; border-radius: 50%; color: #777; font-size: 8px;
  }
  .node-copy { min-width: 0; }
  .node-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8px; }
  .node-copy small { display: block; margin-top: 1px; color: var(--muted); font-size: 7px; }
  .node.done .node-dot { border-color: rgba(184,230,60,.55); background: rgba(184,230,60,.12); color: var(--green); }
  .node.current { border-color: rgba(255,122,26,.55); background: linear-gradient(135deg, rgba(255,122,26,.12), #141414); }
  .node.current .node-dot { border-color: var(--orange); color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,26,.08); }
  .node.locked { opacity: .5; }

  .goal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
  .goal { padding: 8px 6px; text-align: center; }
  .goal svg { width: 16px; height: 16px; margin: 0 auto 4px; color: #666; }
  .goal b { display: block; font-size: 8px; }
  .goal small { display: block; margin-top: 2px; color: var(--muted); font-size: 7px; }
  .goal.unlocked svg { color: var(--green); }

  .quick-card { display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 8px; padding: 10px; text-align: left; }
  .quick-icon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid #3b3b3b; border-radius: 5px; color: var(--blue); }
  .quick-icon svg { width: 17px; height: 17px; }
  .quick-card b { display: block; font-size: 10px; }
  .quick-card small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
  .quick-card .chev { flex: 0 0 auto; width: 14px; height: 14px; color: #666; }
  .quick-card .chev svg { width: 14px; height: 14px; }

  /* ============ 图鉴 ============ */
  .dex-progress { padding: 10px; }
  .dex-progress .row { margin-bottom: 6px; }
  .dex-progress b { font-size: 11px; }
  .dex-progress span { color: var(--green); font-size: 10px; }
  .dex-progress small { color: var(--muted); font-size: 8px; }
  .search-box {
    display: flex; align-items: center; gap: 7px; margin: 8px 0; padding: 9px 10px;
    border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel);
    color: var(--muted); font-size: 9px;
  }
  .search-box svg { width: 14px; height: 14px; }
  .region-list { display: flex; flex-direction: column; gap: 7px; }
  .region { overflow: hidden; }
  .region-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px; border: 0; background: transparent; text-align: left; }
  .region-orb { width: 27px; height: 27px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid #3d3d3d; border-radius: 50%; color: var(--green); font-size: 9px; }
  .region-copy { flex: 1; min-width: 0; }
  .region-copy b { display: block; font-size: 10px; }
  .region-copy small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
  .region-count { color: var(--ink-dim); font-size: 9px; }
  .region-head svg { width: 13px; height: 13px; color: #666; transition: transform .18s; }
  .region.open .region-head svg { transform: rotate(90deg); }
  .region-body { padding: 0 9px 9px; border-top: 1px solid var(--line-soft); }
  .type-row { display: flex; gap: 5px; padding: 8px 0; overflow-x: auto; scrollbar-width: none; }
  .type-row::-webkit-scrollbar { display: none; }
  .type-chip { flex: 0 0 auto; padding: 3px 7px; border: 1px solid #333; border-radius: 10px; color: var(--muted); font-size: 7px; }
  .type-chip.on { border-color: rgba(184,230,60,.5); background: rgba(184,230,60,.1); color: var(--green); }
  .mon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mon-card { padding: 7px 4px 6px; text-align: center; }
  .mon-card img { width: 49px; height: 49px; object-fit: contain; margin: 0 auto 3px; }
  .mon-card b { display: block; font-size: 8px; }
  .mon-card small { display: block; margin-top: 1px; color: var(--green); font-size: 7px; }
  .mon-card.locked img { filter: brightness(0) opacity(.3); }
  .mon-card.locked b { color: #777; }
  .mon-card.locked small { color: #555; }

  /* ============ 商店 ============ */
  .shop-banner {
    display: flex; align-items: center; gap: 9px; padding: 10px;
    border: 1px solid rgba(255,122,26,.28); border-radius: 7px;
    background: linear-gradient(100deg, rgba(255,122,26,.13), rgba(255,122,26,.02));
  }
  .shop-banner svg { width: 22px; height: 22px; color: var(--orange); }
  .shop-banner b { display: block; font-size: 10px; }
  .shop-banner small { display: block; margin-top: 2px; color: var(--ink-dim); font-size: 8px; }
  .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .shop-card { padding: 9px; text-align: left; }
  .shop-card .item-ico { height: 48px; display: grid; place-items: center; color: var(--green); }
  .shop-card .item-ico svg { width: 32px; height: 32px; }
  .shop-card .item-ico img { width: 42px; height: 42px; object-fit: contain; }
  .shop-card b { display: block; font-size: 9px; }
  .shop-card small { display: block; margin: 2px 0 7px; color: var(--muted); font-size: 7px; }
  .price-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
  .price { display: inline-flex; align-items: center; gap: 3px; color: var(--green); font-size: 9px; }
  .price svg { width: 11px; height: 11px; }
  .shop-card .btn { min-height: 24px; padding: 0 7px; font-size: 8px; }

  .egg-card { margin-top: 8px; padding: 10px; }
  .egg-top { display: flex; align-items: center; gap: 9px; }
  .egg-art { width: 45px; height: 45px; display: grid; place-items: center; border: 1px solid #3d3d3d; border-radius: 6px; background: #1c1c1c; color: var(--orange); }
  .egg-art svg { width: 27px; height: 27px; }
  .egg-copy { flex: 1; min-width: 0; }
  .egg-copy b { display: block; font-size: 10px; }
  .egg-copy small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
  .egg-bar { margin-top: 8px; }

</style>
</head>

      ${sectionHead('操作')}
      <div class="list-card card">
        <button class="list-row" type="button" data-action="view:train"><span class="row-ico">${icon('spark')}</span><span class="grow"><b>训练</b><small>提升属性与等级</small></span>${icon('chevron')}</button>
        <button class="list-row" type="button" data-action="toast:已加入首发阵容"><span class="row-ico">${icon('team')}</span><span class="grow"><b>加入首发</b><small>替换当前同位置球员</small></span>${icon('chevron')}</button>
      </div>
    </section>`;
  }
  return renderHome();
}

/* ================= 渲染与交互 ================= */
function renderTab(tab) {
  if (tab === 'team') return renderTeam();
  if (tab === 'season') return renderSeason();
  if (tab === 'dex') return renderDex();
  if (tab === 'shop') return renderShop();
  return renderHome();
}

function currentView() { return state.stack[state.stack.length - 1] || null; }

function render() {
  const view = currentView();
  content.innerHTML = view ? renderView(view) : renderTab(state.tab);
  content.scrollTop = 0;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === state.tab));
}

function pushView(name, extra = {}) {
  state.stack.push({ name, ...extra });
  render();
}

function goBack() {
  if (state.stack.length) state.stack.pop();
  render();
}

function switchTab(tab) {
  state.tab = tab;
  state.stack = [];
  render();
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function openSheet(type) {
  state.sheetOpen = true;
  if (type === 'settings') {
    sheet.innerHTML = `<div class="sheet-head"><b>设置</b><button type="button" data-action="close-sheet">${icon('close')}</button></div>
      <div class="setting-row"><span class="grow"><b>音乐</b><small>主界面与比赛背景音乐</small></span><button class="switch on" type="button" data-action="toggle-switch"><i></i></button></div>
      <div class="setting-row"><span class="grow"><b>音效</b><small>投篮、抢断、结算提示音</small></span><button class="switch on" type="button" data-action="toggle-switch"><i></i></button></div>
      <div class="setting-row"><span class="grow"><b>自动换防</b><small>防守时自动切换最近球员</small></span><button class="switch on" type="button" data-action="toggle-switch"><i></i></button></div>
      <div class="setting-row"><span class="grow"><b>比赛播报</b><small>得分与关键事件语音</small></span><button class="switch on" type="button" data-action="toggle-switch"><i></i></button></div>
      <div class="setting-row"><span class="grow"><b>画质</b><small>当前：标准</small></span><span class="pill">标准</span></div>`;
  } else {
    sheet.innerHTML = `<div class="sheet-head"><b>通知</b><button type="button" data-action="close-sheet">${icon('close')}</button></div>
      <div class="notice-row"><i class="news-dot"></i><span><b>华蓝道馆已解锁</b><small>完成 3 枚徽章目标，新的馆主挑战开放。前往赛程继续冒险。</small></span></div>
      <div class="notice-row"><i class="news-dot" style="background:var(--orange)"></i><span><b>每日商店已刷新</b><small>今日出现稀有精灵蛋，06:42:18 后更换。</small></span></div>
      <div class="notice-row"><i class="news-dot" style="background:var(--blue)"></i><span><b>版本更新预告</b><small>底部 Tab 界面正在制作中，当前为可点击原型。</small></span></div>`;
  }
  backdrop.classList.add('show');
  sheet.classList.add('show');
}

function closeSheet() {
  state.sheetOpen = false;
  backdrop.classList.remove('show');
  sheet.classList.remove('show');
}

document.addEventListener('click', (e) => {
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const [kind, ...rest] = actionEl.dataset.action.split(':');
    const value = rest.join(':');
    if (kind === 'tab') switchTab(value);
    else if (kind === 'view') {
      const [name, dex] = value.split(':');
      pushView(name, dex ? { dex: Number(dex) } : {});
    } else if (kind === 'back') goBack();
    else if (kind === 'sheet') openSheet(value);
    else if (kind === 'close-sheet') closeSheet();
    else if (kind === 'toast') showToast(value);
    else if (kind === 'toggle-switch') actionEl.classList.toggle('on');
    else if (kind === 'dex-region') {
      state.dexOpen = state.dexOpen === value ? '' : value;
      render();
    }
    return;
  }
  if (e.target.closest('#sheet-backdrop')) closeSheet();
});

el('coach-avatar').innerHTML = icon('team');
el('bell-icon').innerHTML = icon('bell');
el('gear-icon').innerHTML = icon('gear');
document.querySelectorAll('[data-icon]').forEach((n) => { n.innerHTML = icon(n.dataset.icon); });

render();

function fitStage() {
  const scale = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1);
  el('stage').style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();
</script>
</body>
</html>
