<style>
  /* ===== 跨设备等比缩放舞台：以 390×844 设计稿为基准，只整体缩放，不重排 ===== */
  html, body { position: fixed; inset: 0; height: 100%; background: #05060f; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: manipulation; -webkit-overflow-scrolling: auto; }
  :root { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  #stage {
    position: fixed;
    left: 50%;
    top: var(--stage-top, 0px);
    width: 390px;
    height: var(--stage-h, 844px);
    transform: translateX(-50%) scale(var(--stage-s, 1));
    transform-origin: top center;
    overflow: hidden;
    /* 安全区由舞台整体让位，舞台内部不再重复留白 */
    --safe-t: 0px;
    --safe-b: 0px;
    --sat: 0px;
  }
  /* 局内「横屏」按钮触发的旋转模式：交还给物理视口，沿用原有 100dvh/100vw 布局 */
  #stage.rot-live { left: 0; top: 0; width: 100%; height: 100%; transform: none; transform-origin: 0 0; overflow: visible; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  #app { height: 100%; }
  /* 竖屏提示：仅横屏且未主动使用局内横屏时出现 */
  #rotate-hint {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #05060f; color: #f4f1e8; text-align: center; padding: 24px;
    font-family: "FusionPixel", "PingFang SC", "Microsoft YaHei", monospace;
  }
  #rotate-hint[hidden] { display: none; }
  #rotate-hint .rh-icon { width: 64px; height: 64px; color: #ffcb05; animation: rh-tilt 2.2s ease-in-out infinite; }
  #rotate-hint b { font-size: 20px; color: #ffcb05; letter-spacing: 2px; }
  #rotate-hint small { font-size: 13px; color: #9aa0c0; line-height: 1.6; }
  @keyframes rh-tilt { 0%, 45% { transform: rotate(0deg); } 65%, 100% { transform: rotate(90deg); } }
  /* 启动兜底：模块冷加载/存档结算期间先显示加载页，避免只有黑屏 */
  #boot-screen {
    position: fixed; inset: 0; z-index: 99998;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #05060f; color: #f4f1e8; text-align: center; padding: 24px;
    font-family: "FusionPixel", "PingFang SC", "Microsoft YaHei", monospace;
    transition: opacity .22s ease;
  }
  #boot-screen.hide { opacity: 0; pointer-events: none; }
  #boot-screen .bs-logo { font-size: 24px; font-weight: 800; letter-spacing: 6px; color: #ffcb05; }
  #boot-screen .bs-spin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.18); border-top-color: #ffcb05;
    animation: bs-spin .8s linear infinite;
  }
  #boot-screen p { margin: 0; font-size: 12px; color: #9aa0c0; line-height: 1.6; }
  #boot-screen button {
    padding: 9px 18px; border: 2px solid #ffcb05; border-radius: 4px;
    background: transparent; color: #ffcb05; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  #boot-screen button[hidden] { display: none; }
  @keyframes bs-spin { to { transform: rotate(360deg); } }
</style>

<body>
<div id="boot-screen" aria-live="polite">
  <div class="bs-logo">口袋灌篮</div>
  <div class="bs-spin" aria-hidden="true"></div>
  <p id="boot-msg">正在读取存档…</p>
  <button id="boot-retry" type="button" hidden>重新加载</button>
</div>
<script>
/* 启动加载页兜底：模块加载完成或首屏渲染后由 app.js 调用 __pjBootDone */
(function () {
  var boot = document.getElementById("boot-screen");
  if (!boot) return;
  var msg = document.getElementById("boot-msg");
  var retry = document.getElementById("boot-retry");
  var slow = setTimeout(function () { if (msg) msg.textContent = "加载时间较长，请稍候…"; }, 6000);
  var fail = setTimeout(function () {
    if (!boot || boot.classList.contains("hide")) return;
    if (msg) msg.textContent = "加载失败，请检查网络后重试";
    if (retry) retry.hidden = false;
  }, 15000);
  if (retry) retry.addEventListener("click", function () { location.reload(); });
  window.__pjBootDone = function () {
    clearTimeout(slow);
    clearTimeout(fail);
    if (!boot || !boot.parentNode) return;
    boot.classList.add("hide");
    setTimeout(function () { boot.remove(); }, 240);
  };
})();
</script>

<script>
/* 崩溃兜底：运行中未捕获异常时不再黑屏，显示可操作的恢复界面并记录错误 */
(function () {
  var LOG_KEY = "pokedunk.err.log";
  var shown = false;
  window.__pjStart = Date.now();
  function sessionInfo() {
    var mins = Math.round((Date.now() - (window.__pjStart || Date.now())) / 60000);
    var heap = 0;
    try { heap = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : 0; } catch (e) {}
    return { mins: mins, heap: heap };
  }
  function logErr(kind, msg) {
    try {
      var arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
      var si = sessionInfo();
      arr.push({
        t: Date.now(), kind: kind, msg: String(msg || "").slice(0, 400),
        ua: navigator.userAgent.slice(0, 160),
        mem: navigator.deviceMemory || null, cpu: navigator.hardwareConcurrency || null,
        up: si.mins, heap: si.heap
      });
      localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(-5)));
    } catch (e) {}
  }
  function ignorable(msg) {
    var s = String(msg || "");
    return /AbortError|NotAllowedError|play\(\) failed|ResizeObserver|Script error/i.test(s);
  }
  function modal(kind, msg) {
    if (shown || !document.body) return;
    shown = true;
    logErr(kind, msg);
    var ov = document.createElement("div");
    ov.id = "pj-fatal";
    ov.style.cssText = [
      "position:fixed", "inset:0", "z-index:999999", "display:flex", "align-items:center", "justify-content:center",
      "padding:20px", "background:rgba(3,4,8,.94)", "font-family:'FusionPixel','PingFang SC','Microsoft YaHei',sans-serif"
    ].join(";");
    ov.innerHTML =
      '<div style="width:100%;max-width:320px;padding:18px 16px;border:3px solid var(--r-ink,#f2f2f2);border-radius:4px;' +
      'background:var(--r-paper,#060606);color:var(--r-ink,#f2f2f2);box-shadow:7px 7px 0 rgba(255,255,255,.3)">' +
      '<b style="display:block;font-size:17px;letter-spacing:.04em">页面遇到问题</b>' +
      '<p style="margin:8px 0 14px;font-size:12px;line-height:1.6;color:var(--text-dim,#9a9a9a)">' +
      '可能是设备内存不足或 WebView 中断。点下方按钮重新进入，进度会自动保存。</p>' +
      '<button id="pj-fatal-reload" style="width:100%;padding:12px 0;border:2px solid var(--r-ink,#f2f2f2);border-radius:3px;' +
      'background:var(--gold,#ff7a1a);color:#111;font-weight:800;font-size:14px;letter-spacing:.04em">重新加载</button>' +
      '<button id="pj-fatal-continue" style="width:100%;margin-top:8px;padding:10px 0;border:2px solid var(--line,#3a3a3a);border-radius:3px;' +
      'background:transparent;color:var(--text-dim,#9a9a9a);font-weight:700;font-size:12px">继续游戏</button>' +
      '<button id="pj-fatal-copy" style="width:100%;margin-top:8px;padding:8px 0;border:1px dashed var(--line,#3a3a3a);border-radius:3px;' +
      'background:transparent;color:var(--text-dim,#9a9a9a);font-weight:700;font-size:11px">复制错误信息</button>' +
      '<p id="pj-fatal-detail" style="margin:10px 0 0;font-size:10px;line-height:1.5;color:var(--text-dim,#9a9a9a);word-break:break-all"></p>' +
      '</div>';
    document.body.appendChild(ov);
    var detail = ov.querySelector("#pj-fatal-detail");
    var si = sessionInfo();
    if (detail) {
      detail.textContent = "错误信息：" + String(msg || kind || "").slice(0, 160) +
        " · 已玩 " + si.mins + " 分钟" + (si.heap ? " · 堆内存 " + si.heap + "MB" : "");
    }
    ov.querySelector("#pj-fatal-continue").addEventListener("click", function () { ov.remove(); shown = false; });
    ov.querySelector("#pj-fatal-reload").addEventListener("click", function () {
      shown = false;
      location.reload();
    });
    ov.querySelector("#pj-fatal-copy").addEventListener("click", function () {
      var report = [
        "口袋灌篮错误报告",
        "时间: " + new Date().toISOString(),
        "类型: " + kind,
        "错误: " + String(msg || "").slice(0, 400),
        "已玩: " + si.mins + " 分钟",
        "堆内存: " + (si.heap || "未知") + "MB",
        "设备内存: " + (navigator.deviceMemory || "未知") + "GB",
        "CPU 核心: " + (navigator.hardwareConcurrency || "未知"),
        "UA: " + navigator.userAgent.slice(0, 200)
      ];
      try {
        var arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
        if (arr.length) report.push("最近错误: " + arr.map(function (x) { return x.kind + "@" + x.up + "min"; }).join(", "));
      } catch (e) {}
      var text = report.join("\n");
      var btn = this;
      var done = function () { btn.textContent = "已复制"; setTimeout(function () { btn.textContent = "复制错误信息"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
      } else fallback();
      function fallback() {
        // 复制被系统拒绝时，把报告摊开成可长按选中的文本，至少能手动复制
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.readOnly = true;
          ta.style.cssText = "width:100%;height:96px;margin-top:8px;box-sizing:border-box;padding:6px;border:1px solid var(--line,#3a3a3a);border-radius:3px;background:#000;color:#ccc;font-size:10px;line-height:1.4";
          if (detail && detail.parentNode) detail.parentNode.insertBefore(ta, detail.nextSibling);
          ta.focus();
          ta.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) {}
          if (ok) done();
          else btn.textContent = "长按上面文字复制";
        } catch (e) {}
      }
    });
  }
  // 供比赛渲染看门狗等模块调用
  window.__pjFatal = modal;
  window.addEventListener("error", function (e) {
    if (e && e.target && e.target !== window && e.target.tagName) return; // 资源加载失败不触发兜底
    if (ignorable(e && e.message)) return;
    // 不在异常当下打断渲染，稍后如已黑屏则接管
    setTimeout(function () { modal("error", (e && e.message) || "unknown error"); }, 1000);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var msg = e && e.reason && (e.reason.message || e.reason);
    if (ignorable(msg)) return;
    setTimeout(function () { modal("rejection", msg || "promise rejection"); }, 1000);
  });
})();
</script>

<script>
/* 舞台等比缩放：宽度按 390 设计稿等比，高度扣除刘海/Home 条安全区后换算成逻辑高度 */
(function () {
  var DESIGN_W = 390;
  var stage = document.getElementById("stage");
  var hint = document.getElementById("rotate-hint");
  if (!stage) return;
  var probe = null;
  function insets() {
    // 调试/设备联调：?safet=47&safeb=34 可模拟刘海与 Home 条
    var q = new URLSearchParams(location.search);
    var dt = parseFloat(q.get("safet"));
    var db = parseFloat(q.get("safeb"));
    if (isFinite(dt) || isFinite(db)) {
      return { top: isFinite(dt) ? dt : 0, bottom: isFinite(db) ? db : 0 };
    }
    if (!probe) {
      probe = document.createElement("div");
      probe.setAttribute("aria-hidden", "true");
      probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);";
      document.body.appendChild(probe);
    }
    var cs = getComputedStyle(probe);
    // 安卓 WebView 的 env(safe-area-inset-top) 常为 0，但系统状态栏仍压在页面上；
    // Lamps 父页可以通过 getStatusBarInfo 下发真实状态栏高度，取两者较大值。
    var lampTop = Number(window.__stageStatusTop) || 0;
    return {
      top: Math.max(parseFloat(cs.paddingTop) || 0, lampTop),
      bottom: parseFloat(cs.paddingBottom) || 0,
    };
  }
  function apply() {
    if (document.querySelector(".game.rot")) {
      stage.classList.add("rot-live");
      hint.hidden = true;
      return;
    }
    stage.classList.remove("rot-live");
    var w = window.innerWidth || 390;
    var h = window.innerHeight || 844;
    if (w > h + 2) {
      hint.hidden = false;
      return;
    }
    hint.hidden = true;
    var ins = insets();
    // iOS Safari 下拉回弹/底部工具栏会二次遮挡底部；额外预留空白区
    var q = new URLSearchParams(location.search);
    var qgap = parseFloat(q.get("gapb"));
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "")
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var gapBottom = isFinite(qgap) ? qgap : (ios ? 18 : 0);
    var availH = Math.max(320, h - ins.top - ins.bottom - gapBottom);
    // 先按宽度铺满；若安全区导致可用高度不足 844 设计稿，则整体等比缩小，
    // 保证 390×844 的完整内容始终可见（iOS 刘海/Home 条不再裁掉底部）。
    var base = Math.min(1.25, w / DESIGN_W);
    var logicalH = availH / base;
    var s = base;
    if (logicalH < 844) {
      s = Math.min(1.25, availH / 844);
      logicalH = 844;
    }
    s = Math.max(0.35, s);
    stage.style.setProperty("--stage-top", ins.top + "px");
    stage.style.setProperty("--stage-s", String(s));
    stage.style.setProperty("--stage-h", logicalH + "px");
    document.documentElement.style.setProperty("--stage-h-logical", logicalH + "px");
    document.documentElement.style.setProperty("--stage-s-logical", String(s));
    window.__stageInfo = { w: w, h: h, scale: s, logicalH: logicalH, safeTop: ins.top, safeBottom: ins.bottom, gapBottom: gapBottom };
  }
  window.__stageApply = apply;
  apply();
  window.addEventListener("resize", apply);
  window.addEventListener("orientationchange", function () { setTimeout(apply, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", apply);
})();
</script>

<script>
/* 状态栏安全顶同步：Lamps 父页异步下发状态栏高度，拿到后重新计算舞台顶部偏移，
   避免安卓 WebView 中 env(safe-area-inset-top)=0 时顶部按钮被系统状态栏盖住。 */
(function () {
  var tries = 0;
  function sync() {
    try {
      if (!window.LampsGame || typeof window.LampsGame.getStatusBarInfo !== "function") return false;
      window.LampsGame.getStatusBarInfo().then(function (res) {
        var h = res && res.data && Number(res.data.height);
        window.__stageStatusTop = isFinite(h) && h > 0 ? h : 0;
        if (window.__stageApply) window.__stageApply();
      }).catch(function () {});
      return true;
    } catch (e) {
      return false;
    }
  }
  if (!sync()) {
    var timer = setInterval(function () {
      if (sync() || ++tries > 20) clearInterval(timer);
    }, 100);
  }
  window.addEventListener("orientationchange", function () {
    setTimeout(function () {
      window.__stageStatusTop = 0;
      sync();
    }, 150);
  });
  window.addEventListener("load", function () { sync(); });
  window.addEventListener("pageshow", function () { sync(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) sync(); });
})();
</script>
